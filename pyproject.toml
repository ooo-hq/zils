[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zils-subnet"
version = "0.1.0"
description = "Zils miner, validator, and shared model contracts"
requires-python = ">=3.13"
dependencies = ["requests==2.34.2", "bittensor-wallet==4.1.1"]

[tool.setuptools.packages.find]
include = ["zils", "miner"]

[tool.setuptools.package-data]
zils = ["*.json"]
